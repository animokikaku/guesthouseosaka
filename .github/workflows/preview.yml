name: Preview

on:
  pull_request:
  repository_dispatch:
    types:
      - 'vercel.deployment.success'

jobs:
  publish_ignored_preview_status:
    name: Publish Ignored Preview Status
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: ignored
        name: Check whether Vercel ignored this commit
        run: |
          if git diff --quiet HEAD^ HEAD -- ':!**/__tests__/**' ':!**/*.test.*' ':!**/*.spec.*' app/ components/ lib/ sanity/ public/ messages/ package.json bun.lock next.config.ts; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/github-script@v9
        if: steps.ignored.outputs.value == 'true'
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              context: 'Preview',
              description: 'Preview tests not required for this change.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  preview_tests:
    name: Run Preview Tests
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'preview'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.git.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Run preview tests
        run: bun run test:e2e:preview
        env:
          BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-playwright-artifacts
          path: test-results
          if-no-files-found: ignore

  publish_preview_status:
    name: Publish Preview Status
    needs: preview_tests
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const result = '${{ needs.preview_tests.result }}';
            const state = ['success', 'skipped'].includes(result) ? 'success' : 'failure';
            const description =
              result === 'success'
                ? 'Preview tests passed.'
                : result === 'skipped'
                  ? 'Preview tests not required for this deployment.'
                  : 'Preview tests failed.';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.client_payload.git.sha }}',
              state,
              context: 'Preview',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
