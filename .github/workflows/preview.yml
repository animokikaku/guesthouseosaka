name: Preview

on:
  repository_dispatch:
    types:
      - 'vercel.deployment.success'

jobs:
  preview:
    name: Preview
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'preview'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.git.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Run preview tests
        run: bun run test:e2e:preview
        env:
          BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-playwright-artifacts
          path: test-results
          if-no-files-found: ignore

  report-preview:
    name: Report Preview
    needs: preview
    if: always() && needs.preview.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const result = '${{ needs.preview.result }}';
            const state = result === 'success' ? 'success' : 'failure';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.client_payload.git.sha }}',
              state,
              context: 'Preview',
              description:
                state === 'success'
                  ? 'Preview tests passed.'
                  : 'Preview tests failed.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
