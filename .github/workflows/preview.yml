name: Preview

on:
  repository_dispatch:
    types:
      - 'vercel.deployment.success'
      - 'vercel.deployment.ignored'

jobs:
  preview_status:
    name: Preview Status
    if: github.event.client_payload.environment == 'preview'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        if: github.event.action == 'vercel.deployment.success'
        with:
          ref: ${{ github.event.client_payload.git.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        if: github.event.action == 'vercel.deployment.success'

      - name: Cache bun dependencies
        if: github.event.action == 'vercel.deployment.success'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        if: github.event.action == 'vercel.deployment.success'
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        if: github.event.action == 'vercel.deployment.success'
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run preview tests
        id: preview-tests
        if: github.event.action == 'vercel.deployment.success'
        run: bun run test:e2e:preview --retries=0
        env:
          BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright artifacts
        if: failure() && github.event.action == 'vercel.deployment.success'
        uses: actions/upload-artifact@v7
        with:
          name: preview-playwright-artifacts
          path: test-results
          if-no-files-found: ignore

      - name: Publish Preview Status
        if: always()
        uses: actions/github-script@v9
        env:
          PREVIEW_TEST_OUTCOME: ${{ steps.preview-tests.outcome }}
        with:
          script: |
            const testsRequired = context.payload.action === 'vercel.deployment.success';
            const failed = testsRequired && process.env.PREVIEW_TEST_OUTCOME !== 'success';
            const sha = context.payload.client_payload.git.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: failed ? 'failure' : 'success',
              context: 'Preview',
              description: failed
                ? 'Preview tests failed.'
                : testsRequired
                  ? 'Preview tests passed.'
                  : 'Preview tests not required for this change.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
