name: Studio

# Deploys the production Studio (see `SANITY_STUDIO_HOSTS` in lib/config.ts) when
# a file the Studio is built from changes on `main`. The development Studio is
# deployed by hand from the branch whose schema it should show, with
# `bun run studio:deploy` (see docs/sanity-workflow.md).
#
# Both Studios auto-update the `sanity` package (`autoUpdates` in sanity.cli.ts),
# so dependency bumps don't deploy; a plugin update goes out with the next deploy.
on:
  push:
    branches: [main]
    paths:
      - 'sanity/**'
      - 'sanity.config.ts'
      - 'sanity.cli.ts'
      # What sanity.config.ts imports outside sanity/.
      - 'i18n/locales.ts'
      - 'i18n/routing.ts'
      - 'lib/assets.ts'
      - 'lib/config.ts'
      - 'lib/env.ts'
      - 'lib/google-maps-url.ts'
      - 'lib/icons/**'
      - 'lib/types/**'
      - '.github/workflows/studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production Studio
    # A manual run on another branch would deploy its schema to production.
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    # A newer push replaces a deploy still running.
    concurrency:
      group: studio-production
      cancel-in-progress: true
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
      VITE_SANITY_DATASET: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.11.1'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy
        run: bunx sanity deploy --yes
