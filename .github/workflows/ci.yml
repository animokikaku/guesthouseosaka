name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # Output is prefixed per script; --no-exit-on-error reports every failure.
      - name: Run code checks, formatting, and unused code checks
        run: bun run --parallel --no-exit-on-error check format:check knip

      - name: Run unit tests
        run: bun run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    # The production build and the E2E suite read real Sanity content; Resend
    # calls are mocked. Unit tests fix their own values in vitest.config.mts.
    env:
      VITE_APP_URL: http://localhost:3000
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      RESEND_API_KEY: re_dummy_test_key
      # Cloudflare's always-passing Turnstile test keys (see lib/config.ts).
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Mount Playwright browser binaries
        uses: useblacksmith/stickydisk@v1
        with:
          path: ~/.cache/ms-playwright
          key: ${{ github.repository }}-playwright-${{ runner.os }}
          commit: on-change

      - name: Install Playwright browsers
        run: bunx playwright install --only-shell chromium

      # The E2E suite spends most of its time on the production build, so the
      # component tests (their own Vite server on another port) run alongside it.
      - name: Run component and E2E tests
        run: bun run --parallel --no-exit-on-error test:components test:e2e
        env:
          # Component coverage for Codecov (see playwright/coverage.ts).
          COVERAGE: '1'

      - name: Upload component coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-playwright/lcov.info
          disable_search: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: test-results
          if-no-files-found: ignore
