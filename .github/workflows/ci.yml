name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    env: &test-env
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_BLOB_STORAGE_URL: ${{ secrets.NEXT_PUBLIC_BLOB_STORAGE_URL }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      RESEND_API_KEY: re_dummy_test_key
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Mount Bun package cache
        uses: useblacksmith/stickydisk@v1
        with:
          path: ~/.bun/install/cache
          key: ${{ github.repository }}-bun-cache
          commit: on-change

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run code checks
        run: bun run check

      - name: Check formatting
        run: bun run format:check

      - name: Check unused code and dependencies
        run: bun run knip

      - name: Run unit tests
        run: bun run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env: *test-env
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Mount Bun package cache
        uses: useblacksmith/stickydisk@v1
        with:
          path: ~/.bun/install/cache
          key: ${{ github.repository }}-bun-cache
          commit: on-change

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Mount Next.js and Turbopack build cache
        uses: useblacksmith/stickydisk@v1
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ github.repository }}-nextjs-${{ github.ref_name }}
          commit: on-change

      - name: Mount Playwright browser binaries
        uses: useblacksmith/stickydisk@v1
        with:
          path: ~/.cache/ms-playwright
          key: ${{ github.repository }}-playwright-${{ runner.os }}
          commit: on-change

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: test-results
          if-no-files-found: ignore
