name: Setup
description: Installs Node.js, Bun and the dependencies, for a job that has checked out the repository.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        # Also read by Workers Builds and version managers; Renovate updates it.
        node-version-file: .node-version

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
